baseURL: https://tavocg.github.io/blog/
locale: es-la
title: tavocg

module:
  imports:
    - path: github.com/imfing/hextra

defaultContentLanguage: es
languages:
  es:
    label: Spanish
    weight: 1

  en:
    label: English
    weight: 2

menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /p
      weight: 1
      params:
        type: link
        icon: calendar

    - identifier: guides
      name: Guides
      pageRef: /d
      weight: 1
      params:
        type: link
        icon: "book-open"

    - identifier: about
      name: About
      pageRef: /about
      weight: 2
      params:
        type: link
        icon: user

    - identifier: rss
      name: RSS
      pageRef: /p/index.xml
      weight: 3
      params:
        type: link
        icon: rss

    - name: Search
      weight: 4
      params:
        type: search

    - name: Language Switcher
      weight: 5
      params:
        type: language-switch
        icon: translate

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

enableGitInfo: true

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/tavocg/blog/edit/main"

  blog:
    list:
      displayTags: true

  toc:
    displayTags: true

  displayUpdatedDate: true

outputs:
  home: [html, llms, rss]
  page: [html, rss]
  section: [html, rss]
